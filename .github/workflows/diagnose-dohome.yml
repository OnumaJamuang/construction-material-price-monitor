name: Diagnose DoHome Search
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnose-dohome.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DoHome bundles
        run: |
          python - <<'PY'
          import requests,re
          base="https://www.dohome.co.th"
          u=base+"/search?q=%E0%B8%9B%E0%B8%B9%E0%B8%99"
          h=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=30).text
          scripts=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',h,re.I)
          print("HTML",len(h),"scripts",len(scripts))
          for s in scripts:
            if "search/page-" not in s: continue
            js=requests.get(base+s,headers={"User-Agent":"Mozilla/5.0"},timeout=30).text
            print("SEARCH_BUNDLE",s,"LEN",len(js))
            for pat in [r'https?://[^"\x27 ]+',r'["\x27]([^"\x27]{0,80}(?:search|product|graphql|api)[^"\x27]{0,120})["\x27]']:
              for m in re.findall(pat,js,re.I):
                print("MATCH",m[:400])
            open("search-bundle.js","w").write(js)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dohome-search-bundle
          path: search-bundle.js