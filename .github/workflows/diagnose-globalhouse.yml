name: Diagnose Global House Search
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnose-globalhouse.yml"]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public search page
        run: |
          python - <<'PY'
          import urllib.request,re
          u='https://globalhouse.co.th/search?keyword=%E0%B8%9B%E0%B8%B9%E0%B8%99'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'th-TH,th;q=0.9'})
          r=urllib.request.urlopen(req,timeout=30)
          h=r.read().decode('utf-8','ignore')
          print('STATUS',r.status,'FINAL',r.geturl(),'LEN',len(h))
          print('PRODUCT_LINKS',len(re.findall(r'href=["\\\']([^"\\\']*(?:product|products|p)/[^"\\\']+)',h,re.I)))
          for key in ['__NEXT_DATA__','application/ld+json','price','sku','product']:
              print(key, h.lower().count(key.lower()))
          links=re.findall(r'href="([^"]*(?:product|products|p)/[^"]+)"',h,re.I)
          for x in links[:8]:
              i=h.find(x); print('---LINK---',x); print(re.sub(r'\\s+',' ',h[max(0,i-2500):i+5000])[:7500])
          PY
