name: Diagnose DoHome Search
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnose-dohome.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find DoHome API host
        run: |
          python - <<'PY'
          import requests,re
          base="https://www.dohome.co.th"; h=requests.get(base+"/search?q=%E0%B8%9B%E0%B8%B9%E0%B8%99",headers={"User-Agent":"Mozilla/5.0"},timeout=30).text
          scripts=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',h,re.I)
          for s in scripts:
            js=requests.get(base+s,headers={"User-Agent":"Mozilla/5.0"},timeout=30).text
            if "54742:" in js or "axios" in js.lower() or "apiUrl" in js or "API_URL" in js or "dohome.co.th/api" in js:
              print("\n###",s,"LEN",len(js))
              for key in ["54742:","axios","baseURL","apiUrl","API_URL","NEXT_PUBLIC","dohome.co.th"]:
                p=0
                while True:
                  p=js.find(key,p)
                  if p<0: break
                  print("KEY",key,"CTX",js[max(0,p-500):p+1000][:1500]);p+=len(key)
          PY