name: Diagnose DoHome Search
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnose-dohome.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test public DoHome search request
        run: |
          python - <<'PY'
          import requests,re,time,hmac,hashlib
          site="https://www.dohome.co.th"; h=requests.get(site+"/search?q=test",headers={"User-Agent":"Mozilla/5.0"},timeout=30).text
          scripts=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',h,re.I)
          cfg=None
          for s in scripts:
            js=requests.get(site+s,headers={"User-Agent":"Mozilla/5.0"},timeout=30).text
            m=re.search(r'baseUrl:"([^"]+)",appKey:"([^"]+)",appId:"([^"]+)"',js)
            if m: cfg=m.groups(); break
          assert cfg,"public web config not found"
          host,key,appid=cfg; path="/products"; ts=str(int(time.time()*1000))
          raw=path+"appId"+appid+"timestamp"+ts
          sig=hmac.new(("INT8xDOHOME-"+key).encode(),raw.encode(),hashlib.sha256).hexdigest().upper()
          headers={"Content-Type":"application/json","platform":"web","appId":appid,"timestamp":ts,"sign":sig,"lang":"th"}
          r=requests.get(host+path,params={"page":1,"limit":20,"search_input":"ปูน"},headers=headers,timeout=30)
          print("STATUS",r.status_code,"LEN",len(r.text)); print(r.text[:12000])
          PY