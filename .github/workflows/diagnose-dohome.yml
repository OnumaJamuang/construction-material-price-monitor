name: Diagnose DoHome Search
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnose-dohome.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Auto Discovery
        run: |
          python - <<'PY'
          import requests
          endpoint="https://hintbcyjdctjyyqtoice.supabase.co/functions/v1/collect-price"
          url="https://www.dohome.co.th/search?q=%E0%B8%9B%E0%B8%B9%E0%B8%99"
          r=requests.post(endpoint,json={"action":"preview","url":url},timeout=90)
          print("STATUS",r.status_code)
          d=r.json(); print("OK",d.get("ok"),"QUERY",d.get("query"),"COUNT",d.get("count"),"TOTAL",d.get("total"))
          for x in (d.get("items") or [])[:3]: print(x.get("sourceSku"),x.get("sourceName"),x.get("regularPrice"),x.get("promoPrice"),x.get("rawDetails",{}).get("brand"))
          if r.status_code!=200: print(d); raise SystemExit(1)
          PY